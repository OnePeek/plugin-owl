# Checks on every pull request (branching-and-delivery standard §4).
# Fast checks into dev; into release the shared workflows also run their slower extras.
# Pushes to dev and release run only the pin check (foundation-playbook §8a P2).
name: checks

on:
  pull_request:
    branches: [dev, release]
    types: [opened, reopened, synchronize] # never edited: ship_change_set.py re-runs checks when a dependency merges (§8a P1, L27)
  push:
    branches: [dev, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    # The tiny checks as steps of one job (delivery-pipelines.md §9.1 "Tiny jobs merged", rulings R-S2i-1, R-S2i-2 and
    # R-S2i-6): pins (OnePeek/.github pins are one v* tag, §8a P2; the docs-version.txt rule is gone, PIPE-SIMPLE v2
    # DOC-1) and the gitleaks secrets scan on pull requests (tree-only, it skips itself on a dev ->
    # release promotion pull request, §8.1; the `secrets` job below covers that). Each check runs even when the other
    # failed; the job fails when any did. Check name `fast / fast`.
    uses: OnePeek/.github/.github/workflows/fast-checks.yml@edd2b7191ea1baaafe9df15147e8cde4d17e5457 # v1.27.0
    with:
      pins: true
      secrets: ${{ github.event_name == 'pull_request' }}
  secrets:
    # R-S2iC-1 / F305: gitleaks on every pull request into release, a dev -> release promotion included, where fast's
    # secrets step skips itself (§8.1). Removed only in the change set that adds certification and release-gate here.
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    uses: OnePeek/.github/.github/workflows/secret-scan.yml@edd2b7191ea1baaafe9df15147e8cde4d17e5457 # v1.27.0
  ready:
    # `ci / ready`, the one summary row the merge tool reads (PIPE-SIMPLE v2 D6): every other job of this workflow
    # passed, or was skipped by its own `if:` and is listed under skippable. A job skipped because one it needs failed
    # fails here too. Table: job | result | how to reproduce locally (OnePeek/.github scripts/ready.py).
    name: ci
    if: ${{ always() }}
    needs: [fast, secrets]
    permissions:
      contents: read
    uses: OnePeek/.github/.github/workflows/ready.yml@edd2b7191ea1baaafe9df15147e8cde4d17e5457 # v1.27.0
    with:
      needs: ${{ toJSON(needs) }} # no runner: a public repo runs on GitHub-hosted runners only (ready.yml default)
      skippable: secrets
      reproduce: |
        fast: vanguard local-ci <worktree> --jobs fast
        secrets: gitleaks git (lefthook pre-commit runs it)
