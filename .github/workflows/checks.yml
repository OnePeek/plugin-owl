# Checks on every pull request (branching-and-delivery standard §4).
# Fast checks into dev; into release the shared workflows also run their slower extras.
name: checks

on:
  pull_request:
    branches: [dev, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    uses: OnePeek/.github/.github/workflows/secret-scan.yml@v1
