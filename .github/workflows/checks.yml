# Checks on every pull request (branching-and-delivery standard §4).
# Fast checks into dev; into release the shared workflows also run their slower extras.
# Pushes to dev and release run only the pin check (foundation-playbook §8a P2).
name: checks

on:
  pull_request:
    branches: [dev, release]
    types: [opened, reopened, synchronize] # never edited: ship_change_set.py re-runs checks when a dependency merges (§8a P1, L27)
  push:
    branches: [dev, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  depends-on:
    # Declared dependencies first (playbook §8a P1): while a `Depends on:` pull request is unmerged, nothing else runs.
    permissions:
      contents: read
      pull-requests: read # the live pull request body (L27)
    uses: OnePeek/.github/.github/workflows/depends-on.yml@d1986020e4990c233b1c5a3761c6bde002a821c5 # v1.22.2
    secrets:
      AGENTS_APP_CLIENT_ID: ${{ secrets.AGENTS_APP_CLIENT_ID }}
      AGENTS_APP_PRIVATE_KEY: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
  pins:
    # OnePeek/.github pins are one v* tag; docs-version.txt is on docs main on pushes and release pull requests (§8a P2, S4).
    needs: depends-on
    uses: OnePeek/.github/.github/workflows/pins.yml@d1986020e4990c233b1c5a3761c6bde002a821c5 # v1.22.2
    secrets:
      AGENTS_APP_CLIENT_ID: ${{ secrets.AGENTS_APP_CLIENT_ID }}
      AGENTS_APP_PRIVATE_KEY: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
  secrets:
    needs: depends-on
    if: github.event_name == 'pull_request'
    uses: OnePeek/.github/.github/workflows/secret-scan.yml@d1986020e4990c233b1c5a3761c6bde002a821c5 # v1.22.2
