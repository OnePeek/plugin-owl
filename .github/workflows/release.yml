# Runs when a release pull request is merged into release (branching-and-delivery standard §5).
# Deploy jobs are added here in Phase E; until then a merge only tags the version.
name: release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    permissions:
      contents: write
    uses: OnePeek/.github/.github/workflows/release-tag.yml@6c400d4708fb6f0b31e00eed43930cba1f4934cb # v1.21.2
