# Pre-commit hooks, the same on macOS, Windows and Linux (branching-and-delivery standard §4).
# Install once per clone: `uvx lefthook install` (or `npx lefthook install`).
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks is not installed: brew install gitleaks (or see https://github.com/gitleaks/gitleaks#installing)" >&2
          exit 1
        fi
        gitleaks git --pre-commit --staged --redact --no-banner
